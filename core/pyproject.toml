[tool.poetry]
name = "haksapick-core"
version = "0.1.0"
description = "HaksaPick B-part AI Core"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115,<1.0"
pydantic = ">=2.8,<3.0"
uvicorn = ">=0.30,<1.0"
langgraph = ">=1.0,<2.0"
langchain-core = ">=1.0,<2.0"
langchain-anthropic = ">=1.0,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
httpx = ">=0.27,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
